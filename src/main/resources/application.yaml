server:
  port: ${RASTER_REDACT_PORT:9070}
  address: ${RASTER_REDACT_HOST:0.0.0.0}

spring:
  servlet:
    multipart:
      max-file-size: ${RASTER_REDACT_MAX_INPUT_BYTES:26214400}
      max-request-size: ${RASTER_REDACT_MAX_REQUEST_BYTES:27262976}

owlmask:
  pdf:
    auth-token: ${RASTER_REDACT_AUTH_TOKEN:}
    max-input-bytes: ${RASTER_REDACT_MAX_INPUT_BYTES:26214400}
    max-pages: ${RASTER_REDACT_MAX_PAGES:200}
    min-dpi: ${RASTER_REDACT_MIN_DPI:72}
    max-dpi: ${RASTER_REDACT_MAX_DPI:300}
    max-rendered-pixels: ${RASTER_REDACT_MAX_RENDERED_PIXELS:250000000}
    max-decoded-stream-bytes: ${RASTER_REDACT_MAX_DECODED_STREAM_BYTES:536870912}
    max-regions: ${RASTER_REDACT_MAX_REGIONS:10000}
    timeout-seconds: ${RASTER_REDACT_TIMEOUT:120}
    max-concurrency: ${RASTER_REDACT_MAX_CONCURRENCY:2}
